site_name: DevPulse Documentation
site_description: A local-first development project health checker
site_author: DevPulse Team
site_url: https://srijan-xi.github.io/DevPulse/

# Repository
repo_name: srijan-xi/DevPulse
repo_url: https://github.com/srijan-xi/DevPulse
edit_uri: edit/main/docs/

# Copyright
copyright: Copyright &copy; 2026 DevPulse

# Theme Configuration
theme:
  name: material
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - toc.follow
  
  icon:
    repo: fontawesome/brands/github
    logo: material/pulse
  
  favicon: assets/favicon.png

# Extensions
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

# Plugins
plugins:
  - search:
      lang: en
      separator: '[\s\-\.]+'
  - minify:
      minify_html: true

# Extra
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/srijan-xi/DevPulse
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/devpulse/
  
  analytics:
    provider: google
    property: !ENV GOOGLE_ANALYTICS_KEY
  
  version:
    provider: mike

# Page Navigation
nav:
  - Home: index.md
  - Getting Started:
      - Quick Start: QUICKSTART.md
      - Project Summary: PROJECT-SUMMARY.md
  - User Guide:
      - CLI Usage: USAGE.md
      - GUI Guide: GUI-GUIDE.md
      - GUI Screenshots: GUI-SCREENSHOTS.md
  - Development:
      - Architecture: ARCHITECTURE.md
      - Development Guide: DEVELOPMENT.md
      - Project Structure: PROJECT-STRUCTURE.md
      - Contributing: ../CONTRIBUTING.md
  - Challenge:
      - GitHub Copilot Challenge: CHALLENGE.md

# Extra CSS and JavaScript
extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/extra.js
  - javascripts/mathjax.js
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
