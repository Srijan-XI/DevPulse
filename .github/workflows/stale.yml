name: Mark Stale Issues and PRs

on:
  schedule:
    - cron: '0 0 * * *'  # Run daily at midnight
  workflow_dispatch:

jobs:
  stale:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    
    steps:
    - uses: actions/stale@v10
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        
        # Issues
        stale-issue-message: |
          This issue has been automatically marked as stale because it has not had 
          recent activity. It will be closed in 7 days if no further activity occurs.
          Thank you for your contributions.
        close-issue-message: |
          This issue was automatically closed due to inactivity. 
          Feel free to reopen if this is still relevant.
        days-before-issue-stale: 30
        days-before-issue-close: 7
        stale-issue-label: 'status/stale'
        exempt-issue-labels: 'status/pinned,status/in-progress,type/bug'
        
        # Pull Requests
        stale-pr-message: |
          This pull request has been automatically marked as stale because it has not had 
          recent activity. It will be closed in 7 days if no further activity occurs.
          Please update or close this PR.
        close-pr-message: |
          This pull request was automatically closed due to inactivity.
          Feel free to reopen if you wish to continue working on this.
        days-before-pr-stale: 14
        days-before-pr-close: 7
        stale-pr-label: 'status/stale'
        exempt-pr-labels: 'status/pinned,status/in-progress,status/review-needed'
